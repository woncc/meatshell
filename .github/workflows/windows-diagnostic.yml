name: Windows diagnostic

on:
  workflow_dispatch:
  push:
    branches: [codex/windows-startup-fix]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      RUSTFLAGS: --cfg slint_debug_property
      CARGO_PROFILE_RELEASE_DEBUG: 1
      CARGO_PROFILE_RELEASE_STRIP: none
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
      CARGO_PROFILE_RELEASE_OPT_LEVEL: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-diagnostic
          cache-on-failure: true
      - name: Build diagnostic executable
        # Native build applies RUSTFLAGS to the host Slint generator as well.
        run: cargo build --locked --release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-diagnostic-${{ github.sha }}
          retention-days: 14
          path: |
            target/release/meatshell.exe
            target/release/meatshell.pdb
          if-no-files-found: error
      - name: Verify version
        shell: pwsh
        run: ./scripts/test-windows-version.ps1 -Executable ./target/release/meatshell.exe
