name: Windows diagnostic

on:
  workflow_dispatch:
  push:
    branches: [codex/windows-startup-fix]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      RUSTFLAGS: --cfg slint_debug_property
      CARGO_PROFILE_RELEASE_DEBUG: 1
      CARGO_PROFILE_RELEASE_STRIP: none
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-diagnostic
      - name: Build diagnostic executable
        run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Verify version
        shell: pwsh
        run: |
          $actual = & ./target/x86_64-pc-windows-msvc/release/meatshell.exe --version
          if ($LASTEXITCODE -ne 0 -or $actual -ne 'meatshell 0.8.2') { throw "Version probe failed: $actual" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-diagnostic-${{ github.sha }}
          retention-days: 14
          path: |
            target/x86_64-pc-windows-msvc/release/meatshell.exe
            target/x86_64-pc-windows-msvc/release/meatshell.pdb
          if-no-files-found: error
