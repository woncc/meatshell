name: Windows validation

on:
  workflow_dispatch:
    inputs:
      diagnostics:
        description: Include Slint property names and use faster diagnostic optimization
        type: boolean
        default: false
  push:
    branches: [codex/windows-startup-fix, codex/windows-startup-fix-slim]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      CARGO_PROFILE_RELEASE_DEBUG: 1
      CARGO_PROFILE_RELEASE_STRIP: none
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-${{ inputs.diagnostics && 'diagnostic' || 'release' }}
          cache-on-failure: true
      - name: Build Windows executable
        shell: pwsh
        run: |
          if ('${{ inputs.diagnostics }}' -eq 'true') {
            $env:RUSTFLAGS = '--cfg slint_debug_property'
            $env:CARGO_PROFILE_RELEASE_LTO = 'false'
            $env:CARGO_PROFILE_RELEASE_CODEGEN_UNITS = '16'
            $env:CARGO_PROFILE_RELEASE_OPT_LEVEL = '1'
          }
          # Native build applies diagnostic flags to the host Slint generator too.
          cargo build --locked --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-candidate-${{ github.sha }}
          retention-days: 14
          path: |
            target/release/meatshell.exe
            target/release/meatshell.pdb
          if-no-files-found: error
      - name: Verify version
        shell: pwsh
        run: ./scripts/test-windows-version.ps1 -Executable ./target/release/meatshell.exe
      - name: Verify GUI startup
        shell: pwsh
        run: ./scripts/test-windows-startup.ps1 -Executable ./target/release/meatshell.exe
