name: Release

# Default publish builds only Windows x86_64 and macOS Apple Silicon.
# Tag pushes and manual runs use this same set. They do not start Linux,
# glibc, Flatpak, or Intel macOS jobs. Already published assets are untouched.
#  - Push a tag like `v0.2.3` -> build the default set and attach it to a Release.
#  - workflow_dispatch -> the same default set, as workflow artifacts only.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create / update the GitHub Release

jobs:
  check-version:
    name: Check tag version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure tag matches Cargo package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -eu
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(sed -n '/^\[package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          LOCK_VERSION="$(awk '
            $0 == "name = \"meatshell\"" { found = 1; next }
            found && $1 == "version" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.lock)"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${CARGO_VERSION}."
            echo "Run: pwsh ./scripts/release.ps1 ${GITHUB_REF_NAME}"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$LOCK_VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.lock meatshell version ${LOCK_VERSION}."
            echo "Run: pwsh ./scripts/release.ps1 ${GITHUB_REF_NAME}"
            exit 1
          fi

  build:
    name: ${{ matrix.name }}
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            bin: meatshell.exe
          - os: macos-15               # Apple Silicon; macos-14 retired 2026-11-02
            target: aarch64-apple-darwin
            name: macos-aarch64
            bin: meatshell
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (release)
        env:
          CARGO_PROFILE_RELEASE_DEBUG: ${{ runner.os == 'Windows' && '1' || '0' }}
          CARGO_PROFILE_RELEASE_STRIP: ${{ runner.os == 'Windows' && 'none' || 'symbols' }}
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Preserve matching Windows symbols
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-symbols-${{ github.sha }}
          path: target/${{ matrix.target }}/release/meatshell.pdb
          if-no-files-found: error
          retention-days: 90

      - name: Verify binary version
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            EXPECTED="${GITHUB_REF_NAME#v}"
          else
            EXPECTED="$(sed -n '/^\[package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          fi
          ACTUAL="$(target/${{ matrix.target }}/release/${{ matrix.bin }} --version)"
          test "$ACTUAL" = "meatshell ${EXPECTED}"

      - name: Verify Windows binary version
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-version.ps1 -Executable ./target/${{ matrix.target }}/release/meatshell.exe

      - name: Verify Windows GUI startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-startup.ps1 -Executable ./target/${{ matrix.target }}/release/meatshell.exe

      - name: Package
        shell: bash
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME:-dev}"
          STAGE="meatshell-${VERSION}-${{ matrix.name }}"

          if [ "${{ runner.os }}" = "macOS" ]; then
            # ── Build a proper .app bundle ────────────────────────────────────
            # Without a bundle macOS opens raw binaries in Terminal.app, which
            # stays alive after the app exits and never shows a Dock icon.
            APP="meatshell.app"
            CONTENTS="$APP/Contents"
            mkdir -p "$CONTENTS/MacOS" "$CONTENTS/Resources"

            cp "target/${{ matrix.target }}/release/meatshell" "$CONTENTS/MacOS/"
            cp THIRD_PARTY_NOTICES.md docs/REMOTE_MCP.md "$CONTENTS/Resources/"

            # Generate .icns from the 1024×1024 PNG using sips + iconutil (both
            # ship with every macOS, no extra tooling needed in CI).
            mkdir -p meatshell.iconset
            sips -z 16  16  "assets/icon@1024.png" --out meatshell.iconset/icon_16x16.png       >/dev/null
            sips -z 32  32  "assets/icon@1024.png" --out meatshell.iconset/icon_16x16@2x.png    >/dev/null
            sips -z 32  32  "assets/icon@1024.png" --out meatshell.iconset/icon_32x32.png        >/dev/null
            sips -z 64  64  "assets/icon@1024.png" --out meatshell.iconset/icon_32x32@2x.png    >/dev/null
            sips -z 128 128 "assets/icon@1024.png" --out meatshell.iconset/icon_128x128.png     >/dev/null
            sips -z 256 256 "assets/icon@1024.png" --out meatshell.iconset/icon_128x128@2x.png  >/dev/null
            sips -z 256 256 "assets/icon@1024.png" --out meatshell.iconset/icon_256x256.png     >/dev/null
            sips -z 512 512 "assets/icon@1024.png" --out meatshell.iconset/icon_256x256@2x.png  >/dev/null
            sips -z 512 512 "assets/icon@1024.png" --out meatshell.iconset/icon_512x512.png     >/dev/null
            cp "assets/icon@1024.png" meatshell.iconset/icon_512x512@2x.png
            iconutil -c icns meatshell.iconset -o "$CONTENTS/Resources/meatshell.icns"

            # Substitute __VERSION__ placeholder (strip leading 'v' from tag)
            VERSION_NUM="${VERSION#v}"
            sed "s/__VERSION__/${VERSION_NUM}/g" assets/Info.plist > "$CONTENTS/Info.plist"

            # Ad-hoc code-sign the assembled bundle.
            # The release profile strips the binary (Cargo.toml: strip = "symbols"),
            # which invalidates the linker's automatic ad-hoc signature — on Apple
            # Silicon that makes the OS refuse to launch it ("app is damaged").
            # Re-signing the whole bundle here restores a valid (ad-hoc) signature,
            # turning the fatal "damaged" error into the normal "unidentified
            # developer" prompt that users can bypass via Open Anyway / xattr.
            codesign --force --deep --sign - "$APP"
            codesign --verify --verbose "$APP"

            # Package with ditto (Apple's tool) — it preserves the bundle's
            # signature and metadata. Plain `zip` mangles them and re-breaks the
            # signature, which would reintroduce the "damaged" error.
            ditto -c -k --keepParent "$APP" "${STAGE}.zip"
            echo "ASSET=${STAGE}.zip" >> "$GITHUB_ENV"

          elif [ "${{ runner.os }}" = "Windows" ]; then
            mkdir "$STAGE"
            cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$STAGE/"
            cp README.md README.en.md CHANGELOG.md THIRD_PARTY_NOTICES.md "$STAGE/" 2>/dev/null || true
            mkdir -p "$STAGE/docs"
            cp docs/REMOTE_MCP.md "$STAGE/docs/"
            7z a "${STAGE}.zip" "$STAGE" >/dev/null
            echo "ASSET=${STAGE}.zip" >> "$GITHUB_ENV"

          else
            echo "Default publish packages only Windows x86_64 and macOS Apple Silicon." >&2
            exit 1
          fi

      # MSI installer with a "choose install location" wizard (WixUI_InstallDir).
      # Best-effort: if the WiX/cargo-wix tooling hiccups it must not block the
      # .zip release, hence continue-on-error.
      - name: Build MSI installer (Windows)
        if: matrix.name == 'windows-x86_64'
        continue-on-error: true
        shell: pwsh
        run: |
          $VERSION = "$env:GITHUB_REF_NAME"; if (-not $VERSION) { $VERSION = "dev" }
          # WiX 3 toolset (candle/light) that cargo-wix drives.
          choco install wixtoolset -y --no-progress
          $candle = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\bin\candle.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($candle) { $env:PATH = "$($candle.DirectoryName);$env:PATH" }
          cargo install cargo-wix --locked
          cargo wix --no-build --nocapture --target ${{ matrix.target }} --output "meatshell-$VERSION-windows-x86_64.msi"
          echo "MSI=meatshell-$VERSION-windows-x86_64.msi" >> $env:GITHUB_ENV

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

      - name: Upload MSI artifact
        if: matrix.name == 'windows-x86_64' && env.MSI != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64-msi
          path: ${{ env.MSI }}

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-remote.') || contains(github.ref_name, '-slim.') }}
          files: ${{ env.ASSET }}
          fail_on_unmatched_files: true

      - name: Attach MSI to GitHub Release
        if: matrix.name == 'windows-x86_64' && env.MSI != '' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-remote.') || contains(github.ref_name, '-slim.') }}
          files: ${{ env.MSI }}
          fail_on_unmatched_files: false

